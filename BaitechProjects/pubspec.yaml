name: baitech_dashboard
description: "BaiTech Projects — дашборд проектов компании: статусы, дедлайны, задания, комментарии, статистика."
publish_to: 'none'
version: 1.6.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  record: ^7.1.1
  audioplayers: ^6.5.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
