server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: все пути ведут на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ядро Flutter НЕ версионируется хэшами — имена стабильны (main.dart.js,
    # flutter.js и т.д.). Если их кэшировать, браузер отдаёт СТАРЫЙ билд после
    # деплоя. Поэтому держим их всегда свежими.
    location = /index.html                { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js              { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache"; }
    location = /flutter.js                { add_header Cache-Control "no-cache"; }
    location = /version.json              { add_header Cache-Control "no-cache"; }
    location = /manifest.json             { add_header Cache-Control "no-cache"; }
    location = /AssetManifest.json        { add_header Cache-Control "no-cache"; }
    location = /AssetManifest.bin.json    { add_header Cache-Control "no-cache"; }
    location = /FontManifest.json         { add_header Cache-Control "no-cache"; }

    # Реально хэшированная статика (canvaskit, шрифты, картинки, медиа) —
    # её можно спокойно кэшировать.
    location ~* \.(wasm|css|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
